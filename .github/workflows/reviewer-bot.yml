name: Reviewer bot

# Posts review comments as github-actions[bot]. pr-babysit ignores comments
# from the user running it, so test comments must come from another account.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
      kind:
        description: What to post
        type: choice
        default: all
        options:
          - all
          - nit
          - question
          - file
          - general
          - injection
          - request-changes
          - approve

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/reviewer_bot.py "$PR" "$KIND"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          KIND: ${{ inputs.kind }}
